<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Библиотека{% endblock %}</title>
</head>
<body>
    <nav>
        <a href="{{ url_for('index') }}">Главная</a>
        <a href="{{ url_for('catalog') }}">Каталог</a>
        {% if g.user %}
            <a href="{{ url_for('profile') }}">Личный кабинет</a>
        {% endif %}

        {% if g.user.role == "librarian" %}
            <a href="{{ url_for('librarian_panel') }}">Панель библиотекаря</a>
        {% endif %}

        {% if g.user is none %}
            <a href="{{ url_for('login') }}">Вход</a>
        {% else %}
            <form method="POST" action="{{ url_for('logout') }}">
                <button type="submit">Выйти</button>
            </form>
        {% endif %}
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
